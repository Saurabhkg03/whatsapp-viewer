<body>

    <!-- Upload Screen -->
    <div id="upload-screen">
        <div class="upload-card">
            <h1>WhatsApp Chat Viewer</h1>
            <p>Upload your exported WhatsApp <b>.zip</b> file to view your chats securely in your browser.</p>
            <label class="upload-btn" for="fileInput">Select .zip File</label>
            <input type="file" id="fileInput" accept=".zip">
            <div id="loading">Processing and rendering chat... please wait.</div>
        </div>
    </div>

    <!-- Main Chat UI -->
    <div id="chat-app">
        <div class="header">
            <div class="header-info">
                <div class="avatar">👤</div>
                <div class="contact-name" id="contactName">Chat Export</div>
            </div>
            <div class="controls">
                <label for="meSelector" style="font-size: 13px; color: var(--text-secondary); margin-right: 5px;">Identify "You":</label>
                <select id="meSelector"></select>
            </div>
        </div>
        <div class="chat-container" id="chatContainer">
            <!-- Messages injected here -->
        </div>
    </div>

    <script>
        let parsedMessages = [];
        let mediaUrls = {};
        let sendersList = [];
        let myName = "";

        const fileInput = document.getElementById('fileInput');
        const uploadScreen = document.getElementById('upload-screen');
        const chatApp = document.getElementById('chat-app');
        const chatContainer = document.getElementById('chatContainer');
        const loading = document.getElementById('loading');
        const meSelector = document.getElementById('meSelector');

        const msgRegex = /^\[?(\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4}),\s(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[a-zA-Z]{2})?)\]?\s?(?:-\s)?([^:]+?):\s([\s\S]*)/;
        const sysRegex = /^\[?(\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4}),\s(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[a-zA-Z]{2})?)\]?\s?(?:-\s)?([\s\S]*)/;

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            loading.style.display = 'block';
            
            try {
                const zip = new JSZip();
                const loadedZip = await zip.loadAsync(file);
                
                let chatText = "";
                mediaUrls = {};

                for (const [filepath, zipEntry] of Object.entries(loadedZip.files)) {
                    if (zipEntry.dir) continue;
                    const filename = filepath.split('/').pop(); 
                    
                    if (filename.endsWith('.txt')) {
                        chatText = await zipEntry.async("string");
                    } else {
                        const blob = await zipEntry.async("blob");
                        mediaUrls[filename] = URL.createObjectURL(blob);
                    }
                }

                if (!chatText) {
                    alert("Could not find a .txt file inside the zip.");
                    loading.style.display = 'none';
                    return;
                }
                parseChat(chatText);
            } catch (error) {
                console.error(error);
                alert("Error processing the zip file.");
                loading.style.display = 'none';
            }
        });

        function parseChat(text) {
            const lines = text.split('\n');
            parsedMessages = [];
            let currentMsg = null;

            lines.forEach(line => {
                line = line.trimEnd();
                if (!line) return;

                const msgMatch = line.match(msgRegex);
                
                if (msgMatch) {
                    if (currentMsg) parsedMessages.push(currentMsg);
                    currentMsg = {
                        type: 'message',
                        date: msgMatch[1],
                        time: msgMatch[2],
                        sender: msgMatch[3].trim(),
                        content: msgMatch[4]
                    };
                } else {
                    const sysMatch = line.match(sysRegex);
                    if (sysMatch && !line.includes(':')) {
                        if (currentMsg) parsedMessages.push(currentMsg);
                        currentMsg = { type: 'system', date: sysMatch[1], time: sysMatch[2], content: sysMatch[3] };
                    } else if (currentMsg) {
                        currentMsg.content += '\n' + line;
                    }
                }
            });

            if (currentMsg) parsedMessages.push(currentMsg);

            sendersList = [...new Set(parsedMessages.filter(m => m.type === 'message').map(m => m.sender))];
            
            // Auto-select "Me" correctly
            myName = sendersList.length > 1 ? sendersList[1] : sendersList[0];

            meSelector.innerHTML = '';
            sendersList.forEach(sender => {
                const opt = document.createElement('option');
                opt.value = sender;
                opt.textContent = sender;
                if (sender === myName) opt.selected = true;
                meSelector.appendChild(opt);
            });

            uploadScreen.style.display = 'none';
            chatApp.style.display = 'flex';
            renderMessages();
        }

        meSelector.addEventListener('change', (e) => {
            myName = e.target.value;
            renderMessages();
        });

        function renderMessages() {
            chatContainer.innerHTML = '';
            let lastSender = null;
            let lastDate = null;
            const colorMap = {};
            let colorIndex = 1;

            parsedMessages.forEach(msg => {
                // STICKY DATE RENDERER
                if (msg.date !== lastDate) {
                    const dateRow = document.createElement('div');
                    dateRow.className = 'date-wrapper';
                    dateRow.innerHTML = `<div class="date-bubble">${msg.date}</div>`;
                    chatContainer.appendChild(dateRow);
                    lastDate = msg.date;
                    lastSender = null; // Reset sender so first msg of the day gets a tail
                }

                const row = document.createElement('div');

                if (msg.type === 'system') {
                    row.className = 'message-row system';
                    row.innerHTML = `<div class="system-msg">${escapeHtml(msg.content)}</div>`;
                    chatContainer.appendChild(row);
                    lastSender = null;
                    return;
                }

                const isMe = msg.sender === myName;
                const isFirstInGroup = lastSender !== msg.sender;
                
                // ADDED `in` and `out` classes to fix left/right alignment!
                row.className = `message-row ${isMe ? 'out' : 'in'} ${isFirstInGroup ? 'first-in-group' : ''}`;
                
                const bubble = document.createElement('div');
                bubble.className = `message ${isMe ? 'message-out' : 'message-in'} ${isFirstInGroup ? 'tail' : ''}`;

                let senderHtml = '';
                // ALWAYS show name for incoming messages if it's the first in the group
                if (!isMe && isFirstInGroup) {
                    if (!colorMap[msg.sender]) {
                        colorMap[msg.sender] = `color-${colorIndex}`;
                        colorIndex = colorIndex > 3 ? 1 : colorIndex + 1; 
                    }
                    senderHtml = `<span class="sender-name ${colorMap[msg.sender]}">${escapeHtml(msg.sender)}</span>`;
                }
                
                let mediaHtml = '';
                let cleanContent = msg.content;

                Object.keys(mediaUrls).forEach(filename => {
                    if (cleanContent.includes(filename)) {
                        const url = mediaUrls[filename];
                        const ext = filename.split('.').pop().toLowerCase();
                        cleanContent = cleanContent.replace(filename, '').replace('<attached: >', '').replace('(file attached)', '').trim();
                        
                        if (['jpg', 'jpeg', 'png', 'webp', 'gif'].includes(ext)) {
                            mediaHtml += `<div class="media-container"><img src="${url}" alt="${filename}"></div>`;
                        } else if (['mp4', 'mov'].includes(ext)) {
                            mediaHtml += `<div class="media-container"><video src="${url}" controls></video></div>`;
                        } else if (['mp3', 'opus', 'm4a', 'wav', 'ogg'].includes(ext)) {
                            mediaHtml += `<div class="media-container"><audio src="${url}" controls></audio></div>`;
                        } else {
                            mediaHtml += `<div class="attachment-placeholder">📄 ${filename}</div>`;
                        }
                    }
                });

                if (cleanContent.includes('(file attached)') || cleanContent.includes('<attached:')) {
                     cleanContent = cleanContent.replace('(file attached)', '').replace(/<attached:.*?>/g, '').trim();
                     if (!mediaHtml) mediaHtml = `<div class="attachment-placeholder">⚠️ Media omitted or missing</div>`;
                }

                bubble.innerHTML = `
                    ${senderHtml}
                    ${mediaHtml}
                    ${cleanContent ? `<span class="text-content">${escapeHtml(cleanContent)}</span>` : ''}
                    <span class="timestamp">${msg.time}</span>
                `;

                row.appendChild(bubble);
                chatContainer.appendChild(row);
                
                lastSender = msg.sender;
            });

            // Auto-scroll to bottom
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 100);
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
